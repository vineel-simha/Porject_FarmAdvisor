<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmAdvisor - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container { display: flex; min-height: 100vh; font-family: 'DM Sans', sans-serif; }
        .auth-left { flex: 1; background: var(--primary-green); color: white; display: flex; flex-direction: column; justify-content: center; padding: 50px; position: relative; overflow: hidden; }
        .auth-left::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: url('https://images.unsplash.com/photo-1592982537447-6f2a6a0a382e?w=800&fit=crop') center/cover; opacity: 0.2; }
        .auth-left-content { position: relative; z-index: 1; text-align: center; }
        .auth-logo { font-family: 'Playfair Display', serif; font-size: 3rem; font-weight: 700; margin-bottom: 20px; display: inline-block; color: white !important; text-decoration: none; }
        .auth-quote { font-size: 1.5rem; font-style: italic; opacity: 0.9; margin-top: 30px; }
        .auth-right { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--background-cream); padding: 40px; }
        .auth-form-wrap { width: 100%; max-width: 450px; background: white; padding: 40px; border-radius: 16px; box-shadow: var(--shadow-md); }
        .auth-form-wrap h2 { font-family: 'Playfair Display', serif; color: var(--primary-green); margin-bottom: 10px; font-size: 2rem; }
        .auth-form-wrap p { color: #666; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 8px; color: var(--text-brown); }
        .form-group input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; transition: 0.3s; }
        .form-group input:focus { border-color: var(--primary-green); outline: none; box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.1); }
        .auth-links { display: flex; justify-content: space-between; margin-top: 15px; font-size: 0.9rem; }
        .auth-links a { color: var(--primary-green); text-decoration: none; font-weight: 500; }
        .btn-full { width: 100%; padding: 14px; font-size: 1.1rem; margin-top: 20px; }
        @media(max-width: 768px) { .auth-container { flex-direction: column; } .auth-left { padding: 40px 20px; flex: 0 0 auto; } }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-left-content">
                <a href="index.html" class="auth-logo" >🌱 FarmAdvisor</a>
                <p class="auth-quote">"Empowering the hands that feed the nation."</p>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-form-wrap">
                <h2>Welcome Back</h2>
                <p>Login to access personalized crop & market tips.</p>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Mobile Number or Email</label>
                        <input type="text" id="loginId" required placeholder="Enter mobile or email">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPass" required placeholder="Enter password">
                    </div>
                    <button type="submit" class="btn btn-green btn-full">Login</button>
                    <div class="auth-links">
                        <a href="#" onclick="alert('Please contact support at help@farmadvisor.in'); return false;">Forgot Password?</a>
                        <a href="signup.html">Don't have an account? Sign Up</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const stored = localStorage.getItem('farmadvisor_user');
            if(stored) {
                const user = JSON.parse(stored);
                if ((document.getElementById('loginId').value === user.mobile || document.getElementById('loginId').value === user.email) && document.getElementById('loginPass').value === user.password) {
                    sessionStorage.setItem('farmadvisor_toast', 'Welcome back, ' + user.name.split(' ')[0] + '! 🌱');
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectUrl = urlParams.get('redirect') || 'index.html';
                    window.location.href = redirectUrl;
                } else {
                    alert('Invalid credentials!');
                }
            } else {
                alert('No account found. Please sign up first.');
                window.location.href = 'signup.html';
            }
        });
        
        // Forward redirect param to signup link
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect');
        if (redirectUrl) {
            const signupLink = document.querySelector('a[href="signup.html"]');
            if (signupLink) signupLink.href = 'signup.html?redirect=' + redirectUrl;
        }
    </script>
    <script src="translations.js"></script>
</body>
</html>
