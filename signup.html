<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmAdvisor - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container { display: flex; min-height: 100vh; font-family: 'DM Sans', sans-serif; }
        .auth-left { flex: 1; background: var(--primary-green); color: white; display: flex; flex-direction: column; justify-content: center; padding: 50px; position: fixed; top: 0; left: 0; bottom: 0; width: 40%; overflow: hidden; }
        .auth-left::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: url('https://images.unsplash.com/photo-1592982537447-6f2a6a0a382e?w=800&fit=crop') center/cover; opacity: 0.2; }
        .auth-left-content { position: relative; z-index: 1; text-align: center; }
        .auth-logo { font-family: 'Playfair Display', serif; font-size: 3rem; font-weight: 700; margin-bottom: 20px; display: inline-block; color: white !important; text-decoration: none; }
        .auth-quote { font-size: 1.5rem; font-style: italic; opacity: 0.9; margin-top: 30px; }
        
        .auth-right { flex: 1; margin-left: 40%; display: flex; align-items: center; justify-content: center; background: var(--background-cream); padding: 50px 40px; min-height: 100vh; }
        .auth-form-wrap { width: 100%; max-width: 600px; background: white; padding: 40px; border-radius: 16px; box-shadow: var(--shadow-md); }
        .auth-form-wrap h2 { font-family: 'Playfair Display', serif; color: var(--primary-green); margin-bottom: 10px; font-size: 2rem; }
        .auth-form-wrap p { color: #666; margin-bottom: 30px; }
        
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 8px; color: var(--text-brown); }
        .form-group input, .form-group select { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; transition: 0.3s; background: #fff; }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary-green); outline: none; box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.1); }
        .auth-links { display: flex; justify-content: center; margin-top: 25px; font-size: 1rem; }
        .auth-links a { color: var(--primary-green); text-decoration: none; font-weight: 500; }
        .btn-full { width: 100%; padding: 15px; font-size: 1.2rem; margin-top: 10px; }
        
        @media(max-width: 900px) { 
            .auth-container { flex-direction: column; } 
            .auth-left { position: relative; width: 100%; padding: 40px 20px; flex: 0 0 auto; min-height: 250px; } 
            .auth-right { margin-left: 0; padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-left-content">
                <a href="index.html" class="auth-logo" >🌱 FarmAdvisor</a>
                <p class="auth-quote">"Your digital partner for better yields."</p>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-form-wrap">
                <h2>Join FarmAdvisor</h2>
                <p>Create your account for personalized farming recommendations.</p>
                <form id="signupForm">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="suName" required placeholder="e.g. Ramesh Kumar">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Mobile Number *</label>
                            <input type="tel" id="suMobile" required pattern="[0-9]{10}" placeholder="10-digit number">
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="suEmail" placeholder="Optional">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>State *</label>
                            <select id="suState" required>
                                <option value="" disabled selected>Select State</option>
                                <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                                <option value="Andhra Pradesh">Andhra Pradesh</option>
                                <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                                <option value="Assam">Assam</option>
                                <option value="Bihar">Bihar</option>
                                <option value="Chandigarh">Chandigarh</option>
                                <option value="Chhattisgarh">Chhattisgarh</option>
                                <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Goa">Goa</option>
                                <option value="Gujarat">Gujarat</option>
                                <option value="Haryana">Haryana</option>
                                <option value="Himachal Pradesh">Himachal Pradesh</option>
                                <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                                <option value="Jharkhand">Jharkhand</option>
                                <option value="Karnataka">Karnataka</option>
                                <option value="Kerala">Kerala</option>
                                <option value="Ladakh">Ladakh</option>
                                <option value="Lakshadweep">Lakshadweep</option>
                                <option value="Madhya Pradesh">Madhya Pradesh</option>
                                <option value="Maharashtra">Maharashtra</option>
                                <option value="Manipur">Manipur</option>
                                <option value="Meghalaya">Meghalaya</option>
                                <option value="Mizoram">Mizoram</option>
                                <option value="Nagaland">Nagaland</option>
                                <option value="Odisha">Odisha</option>
                                <option value="Puducherry">Puducherry</option>
                                <option value="Punjab">Punjab</option>
                                <option value="Rajasthan">Rajasthan</option>
                                <option value="Sikkim">Sikkim</option>
                                <option value="Tamil Nadu">Tamil Nadu</option>
                                <option value="Telangana">Telangana</option>
                                <option value="Tripura">Tripura</option>
                                <option value="Uttar Pradesh">Uttar Pradesh</option>
                                <option value="Uttarakhand">Uttarakhand</option>
                                <option value="West Bengal">West Bengal</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>District</label>
                            <input type="text" id="suDistrict" placeholder="Enter District">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Land Holding (Acres)</label>
                            <input type="number" id="suLand" step="0.1" min="0" placeholder="e.g. 2.5">
                        </div>
                        <div class="form-group">
                            <label>Primary Crops</label>
                            <input type="text" id="suCrops" placeholder="e.g. Wheat, Rice">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Password *</label>
                            <input type="password" id="suPass" required minlength="6" placeholder="Min 6 characters">
                        </div>
                        <div class="form-group">
                            <label>Confirm Password *</label>
                            <input type="password" id="suPassConfirm" required minlength="6" placeholder="Re-enter password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-green btn-full">Create My FarmAdvisor Account 🌱</button>
                    <div class="auth-links">
                        <a href="login.html">Already have an account? Login here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const pass = document.getElementById('suPass').value;
            const confirm = document.getElementById('suPassConfirm').value;
            
            if(pass !== confirm) {
                alert('Passwords do not match!');
                return;
            }
            
            const userData = {
                name: document.getElementById('suName').value,
                mobile: document.getElementById('suMobile').value,
                email: document.getElementById('suEmail').value,
                state: document.getElementById('suState').value,
                district: document.getElementById('suDistrict').value,
                land: document.getElementById('suLand').value,
                crops: document.getElementById('suCrops').value,
                password: pass
            };
            
            localStorage.setItem('farmadvisor_user', JSON.stringify(userData));
            sessionStorage.setItem('farmadvisor_toast', 'Welcome to FarmAdvisor, ' + userData.name.split(' ')[0] + '! 🌱');
            const urlParams = new URLSearchParams(window.location.search);
            const redirectUrl = urlParams.get('redirect') || 'index.html';
            window.location.href = redirectUrl;
        });
        
        // Forward redirect param to login link
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect');
        if (redirectUrl) {
            const loginLink = document.querySelector('a[href="login.html"]');
            if (loginLink) loginLink.href = 'login.html?redirect=' + redirectUrl;
        }
    </script>
    <script src="translations.js"></script>
</body>
</html>
